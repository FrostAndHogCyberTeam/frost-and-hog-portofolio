<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FH2 Global Network | Frost & Hog</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-dark: #05080f; --cyan: #00f3ff; --text-light: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: var(--bg-dark); margin: 0; }

        /* Teks Melayang di Atas Bumi */
        .header-overlay {
            position: absolute; top: 0; left: 0; width: 100%;
            text-align: center; padding: 30px 20px;
            background: linear-gradient(to bottom, rgba(5,8,15,0.9) 0%, rgba(5,8,15,0) 100%);
            z-index: 10; pointer-events: none;
        }
        h1 { 
            font-family: 'Orbitron', sans-serif; color: var(--cyan); 
            font-size: 2rem; text-transform: uppercase; 
            letter-spacing: 4px; text-shadow: 0 0 20px rgba(0, 243, 255, 0.8); 
            margin-bottom: 5px; 
        }
        p { color: #8892b0; font-size: 0.9rem; letter-spacing: 2px; }

        /* Kontainer Bumi 3D */
        #globeViz { width: 100vw; height: 100vh; z-index: 1; }

        /* Desain Kotak Info (Tooltip) saat Pin diklik */
        .scene-tooltip {
            background: rgba(13, 17, 23, 0.95) !important;
            border: 1px solid var(--cyan) !important;
            border-radius: 8px !important;
            padding: 15px !important;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4) !important;
            color: #fff !important;
            font-family: 'Inter', sans-serif !important;
            text-align: center;
        }
        .scene-tooltip h3 { font-family: 'Orbitron'; color: var(--cyan); margin-bottom: 5px; font-size: 1.1rem; }
        .scene-tooltip p { font-size: 0.8rem; color: #a8b2c1; margin-bottom: 10px; }
        
        .teleport-btn {
            display: inline-block; background: var(--cyan); color: #000;
            padding: 8px 15px; text-decoration: none; font-weight: bold;
            font-family: 'Orbitron'; border-radius: 5px; transition: 0.3s; font-size: 0.8rem;
        }
        .teleport-btn:hover { background: #fff; box-shadow: 0 0 15px var(--cyan); }
    </style>
</head>
<body>

    <div class="header-overlay">
        <h1>FH2 Global Network</h1>
        <p>Drag to rotate. Click the neon nodes to teleport.</p>
    </div>

    <!-- Wadah Bumi -->
    <div id="globeViz"></div>

    <!-- Library Globe.gl (3D Earth) -->
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/three-globe"></script>
    <script src="//unpkg.com/globe.gl"></script>

    <script>
        // 1. Inisialisasi Bumi
        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg') // Menggunakan tekstur bumi versi gelap
            .backgroundColor('rgba(0,0,0,0)') // Background transparan (mengikuti warna body)
            .showAtmosphere(true)
            .atmosphereColor('#00f3ff') // Efek atmosfer biru neon
            .atmosphereAltitude(0.15)
            .width(window.innerWidth)
            .height(window.innerHeight);

        // Posisi kamera awal (sedikit di atas ekuator)
        world.pointOfView({ lat: 20, lng: 0, altitude: 2.5 });

        // 2. Data Lokasi (Titik-titik di Bumi)
        const locations = [
            { lat: -6.2088, lng: 106.8456, name: "FH2 Base: Jakarta", desc: "Main command center.", query: "Monumen+Nasional+Jakarta" },
            { lat: 35.6762, lng: 139.6503, name: "Node: Tokyo", desc: "UI/UX partner network.", query: "Tokyo+Tower" },
            { lat: 51.5074, lng: -0.1278, name: "Node: London", desc: "PenTest network.", query: "Big+Ben+London" },
            { lat: 40.7128, lng: -74.0060, name: "Node: New York", desc: "Data center monitoring.", query: "Statue+of+Liberty" },
            { lat: -33.8688, lng: 151.2093, name: "Node: Sydney", desc: "Southern hemisphere operations.", query: "Sydney+Opera+House" }
        ];

        // 3. Fungsi untuk Membuat HTML di dalam Tooltip
        function getTooltipHTML(loc) {
            return `
                <div>
                    <h3>${loc.name}</h3>
                    <p>${loc.desc}</p>
                    <a href="https://www.google.com/maps/search/?api=1&query=${loc.query}" target="_blank" class="teleport-btn">TELEPORT TO MAPS</a>
                </div>
            `;
        }

        // 4. Masukkan Titik (Pin) ke Bumi
        world
            .pointsData(locations)
            .pointLat('lat')
            .pointLng('lng')
            .pointColor(() => '#00f3ff') // Warna pin neon cyan
            .pointAltitude(0.02) // Sedikit menonjol dari permukaan bumi
            .pointRadius(0.4) // Ukuran pin
            .pointLabel(d => getTooltipHTML(d)); // Menampilkan kotak info saat di-hover/klik

        // 5. Sesuaikan Ukuran Bumi Jika Layar Di-resize (misal HP diputar)
        window.addEventListener('resize', () => {
            world.width(window.innerWidth).height(window.innerHeight);
        });

        // 6. Kontrol Rotasi Otomatis (Bumi berputar pelan sendiri)
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.8;
        world.controls().enableDamping = true;

    </script>
</body>
</html>
